name: Update binary
on:
  push:
    tags:
    - 'b*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-stubs:
    name: Build stub binaries
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]
        config:
          - runner: windows-2022
            vscode_arch: x64
            arch: amd64
          - runner: windows-11-arm
            vscode_arch: ARM64
            arch: arm64
        include:
          # GitHub doesn't provide ARM64 binaries for Python 3.10
          - python-version: "3.10"
            config:
              runner: windows-2022
              vscode_arch: x64
              arch: amd64

    runs-on: ${{ matrix.config.runner }}
    steps:
    - name: Set Build Variables
      id: build-vars
      env:
        TAG_NAME: ${{ github.ref }}
      run: |
        export BUILD_NUMBER=$(basename $TAG_NAME)
        export PYTHON_TAG=$(python -c "print('.'.join('${{ matrix.python-version }}'.split('.')[:2]))")

        echo "PYTHON_TAG=${PYTHON_TAG}" | tee -a $GITHUB_ENV
        echo "BUILD_NUMBER=${BUILD_NUMBER}" | tee -a $GITHUB_ENV

    - name: Checkout Template
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install git+https://github.com/beeware/briefcase.git

    - name: Generate VisualStudio Stub App
      env:
        MATRIX_CONFIG_ARCH: ${{ matrix.config.arch }}
        PYTHON_TAG: ${{ env.PYTHON_TAG }}
        BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        MATRIX_CONFIG_VSCODE_ARCH: ${{ matrix.config.vscode_arch }}
      run: |
        # Generate the stub app
        cd stub
        briefcase build windows visualstudio

        echo "Build ${PYTHON_TAG}-${MATRIX_CONFIG_ARCH}-${BUILD_NUMBER} console stub artefact"
        mv "./build/console-stub/windows/visualstudio/${MATRIX_CONFIG_VSCODE_ARCH}/Release/console-stub.exe" ./Stub.exe
        7z a Console-Stub-${PYTHON_TAG}-${MATRIX_CONFIG_ARCH}-${BUILD_NUMBER}.zip Stub.exe

        echo "Build ${PYTHON_TAG}-${MATRIX_CONFIG_ARCH}-${BUILD_NUMBER} GUI stub artefact"
        mv "./build/gui-stub/windows/visualstudio/${MATRIX_CONFIG_VSCODE_ARCH}/Release/GUI Stub.exe" ./Stub.exe
        7z a GUI-Stub-${PYTHON_TAG}-${MATRIX_CONFIG_ARCH}-${BUILD_NUMBER}.zip Stub.exe

        echo "Stub binaries:"
        ls -1 *.zip

    - name: Upload Release Asset to S3
      if: github.event_name == 'push'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        MATRIX_CONFIG_ARCH: ${{ matrix.config.arch }}
        PYTHON_TAG: ${{ env.PYTHON_TAG }}
        BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
      run: |
        python -m pip install -U pip
        python -m pip install -U setuptools
        python -m pip install awscli

        aws s3 cp stub/Console-Stub-${PYTHON_TAG}-${MATRIX_CONFIG_ARCH}-${BUILD_NUMBER}.zip s3://briefcase-support/python/${PYTHON_TAG}/windows/Console-Stub-${PYTHON_TAG}-${MATRIX_CONFIG_ARCH}-${BUILD_NUMBER}.zip
        aws s3 cp stub/GUI-Stub-${PYTHON_TAG}-${MATRIX_CONFIG_ARCH}-${BUILD_NUMBER}.zip s3://briefcase-support/python/${PYTHON_TAG}/windows/GUI-Stub-${PYTHON_TAG}-${MATRIX_CONFIG_ARCH}-${BUILD_NUMBER}.zip
