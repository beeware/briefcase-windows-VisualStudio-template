name: Update binary
on:
  push:
    tags:
    - 'b*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-stubs:
    name: Build stub binaries
    runs-on: ${{ matrix.config.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15" ]
        config:
          - runner: windows-2025
            vscode_arch: x64
            arch: amd64
          - runner: windows-11-arm
            vscode_arch: ARM64
            arch: arm64
    outputs:
      BUILD_NUMBER: ${{ steps.build-vars.outputs.BUILD_NUMBER }}

    steps:
    - name: Set Build Variables
      id: build-vars
      env:
        TAG_NAME: ${{ github.ref }}
      run: |
        export BUILD_NUMBER=$(basename $TAG_NAME)
        export PYTHON_TAG=${{ matrix.python-version }}
        export ARCH=${{ matrix.config.arch }}
        export VSCODE_ARCH=${{ matrix.config.vscode_arch }}

        echo "PYTHON_TAG=${PYTHON_TAG}" | tee -a $GITHUB_ENV
        echo "BUILD_NUMBER=${BUILD_NUMBER}" | tee -a $GITHUB_ENV
        echo "ARCH=${ARCH}" | tee -a $GITHUB_ENV
        echo "VSCODE_ARCH=${VSCODE_ARCH}" | tee -a $GITHUB_ENV

        # Expose BUILD_NUMBER as a step output so it can be consumed as a job output
        echo "BUILD_NUMBER=${BUILD_NUMBER}" | tee -a $GITHUB_OUTPUT

    - name: Checkout Template
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install git+https://github.com/beeware/briefcase.git

    - name: Generate VisualStudio Stub App
      run: |
        # Generate the stub app
        cd stub
        briefcase create windows visualstudio

    - name: Build Stub App
      run: |
        cd stub
        briefcase build windows visualstudio

        echo "Build ${PYTHON_TAG}-${ARCH}-${BUILD_NUMBER} console stub artefact"
        mv "./build/console-stub/windows/visualstudio/${VSCODE_ARCH}/Release/console-stub.exe" ./Stub.exe
        7z a Console-Stub-${PYTHON_TAG}-${ARCH}-${BUILD_NUMBER}.zip Stub.exe

        echo "Build ${PYTHON_TAG}-${ARCH}-${BUILD_NUMBER} GUI stub artefact"
        mv "./build/gui-stub/windows/visualstudio/${VSCODE_ARCH}/Release/GUI Stub.exe" ./Stub.exe
        7z a GUI-Stub-${PYTHON_TAG}-${ARCH}-${BUILD_NUMBER}.zip Stub.exe

        echo "Stub binaries:"
        ls -1 *.zip

    - name: Upload build artefacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ env.PYTHON_TAG }}-${{ env.ARCH }}-Stubs
        path: stub/*.zip

    - name: Upload Release Asset to S3
      if: github.event_name == 'push'
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |
        python -m pip install -U pip
        python -m pip install -U setuptools
        python -m pip install awscli

        aws s3 cp stub/Console-Stub-${PYTHON_TAG}-${ARCH}-${BUILD_NUMBER}.zip s3://briefcase-support/python/${PYTHON_TAG}/windows/Console-Stub-${PYTHON_TAG}-${ARCH}-${BUILD_NUMBER}.zip
        aws s3 cp stub/GUI-Stub-${PYTHON_TAG}-${ARCH}-${BUILD_NUMBER}.zip s3://briefcase-support/python/${PYTHON_TAG}/windows/GUI-Stub-${PYTHON_TAG}-${ARCH}-${BUILD_NUMBER}.zip

  make-release:
    name: Make Release
    runs-on: ubuntu-latest
    needs: [ build-stubs ]
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
        fetch-tags: true

    - name: Get build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        path: dist
        merge-multiple: true

    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        BUILD_NUMBER: ${{ needs.build-stubs.outputs.BUILD_NUMBER }}
      run: |
        gh release create "${BUILD_NUMBER}" \
          --title "${BUILD_NUMBER}" \
          --notes "$(printf 'Build %s of the Briefcase Windows stub binary.\n\nIncludes support for Python 3.11-3.15.\n' "${BUILD_NUMBER}")" \
          --draft \
          --verify-tag \
          dist/*
